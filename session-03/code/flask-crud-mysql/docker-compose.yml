# MySQL for the Book Library API.
# Values come from .env (copy .env.example to .env first).
services:
  mysql:
    image: mysql:8.4
    container_name: book-library-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}   # created automatically on first start
    ports:
      # host port 3307 -> container port 3306, so it never clashes with a
      # MySQL already installed on your machine
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # data survives 'docker compose down'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
